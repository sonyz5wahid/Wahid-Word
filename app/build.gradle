plugins {
    id 'com.android.application'
}

android {
    namespace 'id.wahidword.app'
    compileSdk 35

    defaultConfig {
        applicationId 'id.wahidword.app'
        minSdk 17
        targetSdk 28
        versionCode 1
        versionName '0.1.0-prototype'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
