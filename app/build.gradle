plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.wahidword.app'
    compileSdk 35

    defaultConfig {
        applicationId 'id.wahidword.app'
        minSdk 17
        targetSdk 28
        versionCode 1
        versionName '0.1.0-prototype'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/generated'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // UniFFI's generated Kotlin bridge calls the Rust cdylib through JNA.
    implementation 'net.java.dev.jna:jna:5.16.0@aar'
}
