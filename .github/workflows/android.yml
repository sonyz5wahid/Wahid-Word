name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install legacy NDK and Rust toolchain
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "ndk;23.2.8568313"
          rustup toolchain install 1.99.0 --profile minimal --target armv7-linux-androideabi
          rustup default 1.99.0
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build WordCraft engine for Android 4.2 (ARMv7, API 17)
        working-directory: upstream/wordcraft-android
        run: |
          set -euxo pipefail
          NDK_DIR="$ANDROID_HOME/ndk/23.2.8568313"
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          export ANDROID_NDK_HOME="$NDK_DIR"
          export ANDROID_NDK_ROOT="$NDK_DIR"
          cargo ndk -t armeabi-v7a --platform 17 -o ../../app/src/main/jniLibs build --release -p wordcraft-android --lib
          test -s ../../app/src/main/jniLibs/armeabi-v7a/libwordcraft_android.so
          file ../../app/src/main/jniLibs/armeabi-v7a/libwordcraft_android.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wahid-word-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
