name: Build Wahid Word

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: upstream/wordcraft-android/apps/wordcraft-android/android
    steps:
      - name: Check out Wahid Word
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust toolchain
        working-directory: upstream/wordcraft-android
        run: |
          set -eux
          rustup toolchain install
          rustup default 1.99.0
          rustc --version
          rustup target list --installed

      - name: Install cargo-ndk and Android NDK
        run: |
          set -eux
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null

      - name: Build the real WordCraft Android application
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK package and signature
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='id.wahidword.app.debug'" apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Upload Wahid Word debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wahid-word-debug
          path: upstream/wordcraft-android/apps/wordcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
