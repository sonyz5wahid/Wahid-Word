name: Build Wahid Word

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: upstream/wordcraft-android/apps/wordcraft-android/android
    steps:
      - name: Check out Wahid Word
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        run: |
          set -eux
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"

      - name: Set up Rust and cargo-ndk
        working-directory: upstream/wordcraft-android
        run: |
          set -euxo pipefail
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android --target x86_64-linux-android
          rustup default 1.99.0
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build the real WordCraft Android application
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK package and signature
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='id.wahidword.app.debug'" apk-badging.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"

      - name: Upload Wahid Word debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wahid-word-debug
          path: upstream/wordcraft-android/apps/wordcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
