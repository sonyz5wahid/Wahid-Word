name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Siapkan font
        run: |
          sudo apt-get update -qq
          for p in fonts-liberation2 fonts-crosextra-carlito fonts-crosextra-caladea fonts-open-sans fonts-lato fonts-roboto fonts-dejavu-core; do
            sudo apt-get install -y -qq $p || echo "gagal: $p"
          done
          mkdir -p app/src/main/assets/fonts
          find /usr/share/fonts -type f \( -iname 'Liberation*-*.ttf' -o -iname 'Carlito-*.ttf' -o -iname 'Caladea-*.ttf' \
            -o -iname 'OpenSans-*.ttf' -o -iname 'Lato-Regular.ttf' -o -iname 'Lato-Bold.ttf' -o -iname 'Lato-Italic.ttf' -o -iname 'Lato-BoldItalic.ttf' \
            -o -iname 'Roboto-Regular.ttf' -o -iname 'Roboto-Bold.ttf' -o -iname 'Roboto-Italic.ttf' -o -iname 'Roboto-BoldItalic.ttf' \
            -o -iname 'DejaVuSans.ttf' -o -iname 'DejaVuSans-Bold.ttf' -o -iname 'DejaVuSans-Oblique.ttf' -o -iname 'DejaVuSans-BoldOblique.ttf' \
            -o -iname 'DejaVuSerif.ttf' -o -iname 'DejaVuSerif-Bold.ttf' -o -iname 'DejaVuSerif-Italic.ttf' -o -iname 'DejaVuSerif-BoldItalic.ttf' \) \
            -exec cp -n {} app/src/main/assets/fonts/ \;
          ls -l app/src/main/assets/fonts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WahidWord-APK
          path: app/build/outputs/apk/debug/app-debug.apk
